services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: poc-pocketbase
    restart: unless-stopped
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '${PB_PORT:-8090}:8090'
    volumes:
      - ./pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Production build of the TanStack Start app (Nitro Node server).
  # Started by default: `docker compose up --build`
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: runtime
      args:
        VITE_POCKETBASE_URL: '${VITE_POCKETBASE_URL:-http://localhost:8090}'
    container_name: poc-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      pocketbase:
        condition: service_healthy

  # Vite dev server with HMR (opt-in, different host port so it never
  # clashes with `web`): `docker compose --profile dev up --build web-dev`
  web-dev:
    profiles: ['dev']
    build:
      context: .
      dockerfile: Dockerfile.web
      target: dev
    container_name: poc-web-dev
    ports:
      - '${WEB_DEV_PORT:-3001}:3000'
    environment:
      VITE_POCKETBASE_URL: '${VITE_POCKETBASE_URL:-http://localhost:8090}'
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
    depends_on:
      pocketbase:
        condition: service_healthy
